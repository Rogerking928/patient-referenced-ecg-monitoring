# v2: the same physiology, with the time structure of the *study* fixed.
#
# In v1 every subject started healthy at t = 0 and bled between 8 and 30 minutes, so
# the position of a window in the recording was nearly equivalent to the position of
# the patient in the illness. A metadata-only model using the window index and heart
# rate beat every ECG model. That is a property of the study design, not of the ECG.
#
# Here the trajectory is simulated for four hours and each subject is *observed*
# through a 90-minute window placed at a random point in it, haemorrhage can begin
# at any time including before the recording starts, bleed rates are far more
# dispersed, and a quarter of the bleeders re-bleed after apparent haemostasis.
run:
  seed: 20260803
  out_dir: out_v2

simulation:
  duration_min: 240
  obs_window_min: 90          # length of the observed segment
  n_windows: 30
  window_first_min: 1.5
  window_last_min: 88.5

hemorrhage:
  rate_lognorm_mu: -2.75
  rate_lognorm_sigma: 0.85    # much wider spread of bleed rates
  onset_min_range: [2.0, 160.0]
  frac_spontaneous_stop: 0.30
  stop_after_min_range: [8.0, 60.0]
  rebleed_prob: 0.35          # of those that stop spontaneously
  rebleed_gap_min_range: [10.0, 60.0]
  rebleed_dur_min_range: [10.0, 70.0]

treatment:
  frac_treated: 0.45
  detect_delay_min_range: [4.0, 30.0]
  haemostasis_delay_min_range: [8.0, 55.0]

cohort:
  n_subjects: 1400
  frac_nonbleeder: 0.20
